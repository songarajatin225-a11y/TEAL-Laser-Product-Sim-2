name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # the pinned Playwright installs its browser on 24.04; "latest" has moved past it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
